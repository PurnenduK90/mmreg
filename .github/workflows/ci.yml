name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -m pip install ruff==0.17.3  # pinned: the formatter changes between releases
      - uses: taiki-e/install-action@just
      - run: just lint

  test:
    name: Test, Coverage, Docs & Python Wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov
      - run: just test coverage doc python-wheel-test

  msrv:
    name: MSRV (1.75, Yocto scarthgap)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - run: cargo test --locked --no-default-features && cargo test --locked --all-features && cargo test --locked -p mmreg-capi && cargo test --locked -p mmreg-capi --all-features

  python-oldest:
    name: Python 3.8 (oldest in requires-python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -m pip install uv && uv python install 3.8
      - uses: taiki-e/install-action@just
      - run: just test-python "$(uv python find 3.8)"

  build:
    name: Cross Build
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cross
      - run: just build-targets
