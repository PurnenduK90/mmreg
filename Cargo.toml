[package]
name = "mmreg"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["Purnendu Kumar <purnendu@kumargaur.com>"]
description = "Safe, concurrent 32-bit memory-mapped IO register access for Rust. Library and CLI for embedded and PC (linux) platforms."
license = "MIT"
repository = "https://github.com/PurnenduK90/mmreg"
readme = "README.md"
keywords = ["embedded", "mmio", "registers", "hardware", "memory-mapped"]
categories = ["embedded", "hardware-support"]

[features]
default = ["profile"]
# TOML safety-profile files (`SafetyProfile::parse`, `--validate`); about 170 KB of the binary.
profile = ["dep:serde", "dep:toml"]
# Raw /dev/mem access for addresses no UIO region covers: debug and bring-up builds only.
debug = []

[dependencies]
libc = "0.2"
serde = { version = "1.0", default-features = false, features = ["derive", "std"], optional = true }
toml = { version = "0.8", default-features = false, features = ["parse"], optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
