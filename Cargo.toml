[package]
name = "mmreg"
version = "1.1.1"
edition = "2021"
rust-version = "1.75"
authors = ["Purnendu Kumar <purnendu@kumargaur.com>"]
description = "Safe, concurrent 8/16/32/64-bit memory-mapped IO (UIO and /dev/mem) register access for Rust. Library and CLI for embedded Linux platforms."
license = "MIT"
repository = "https://github.com/PurnenduK90/mmreg"
readme = "README.md"
keywords = ["embedded", "mmio", "registers", "hardware", "memory-mapped"]
categories = ["embedded", "hardware-support"]

[features]
default = ["profile"]
# JSON safety-profile files (`SafetyProfile::parse`, `--validate`).
profile = []
# Raw /dev/mem access for addresses no UIO region covers: debug and bring-up builds only.
debug = []

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
